# JTech Tally Bridge - nginx reverse proxy config
# Drop into /etc/nginx/conf.d/default.conf (or mount as in docker-compose).

upstream jtech_django {
    server web:8000;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Certificates - mount real ones via deploy/certs/
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # Static files (when not using WhiteNoise directly)
    location /static/ {
        alias /app/data/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Main app
    location / {
        proxy_pass http://jtech_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }

    # Health check passthrough
    location /health/ {
        proxy_pass http://jtech_django;
        access_log off;
    }
}
