# JTech Tally Bridge - Production compose
#
# Services:
#   web       - Django + gunicorn (HTTP on 8000)
#   scheduler - Background sync loop
#   nginx     - Reverse proxy (HTTPS termination expected at upstream LB)

version: "3.9"

services:
  web:
    build: .
    image: jtech-tally-bridge:latest
    container_name: jtech-web
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - jtech-net

  scheduler:
    image: jtech-tally-bridge:latest
    container_name: jtech-scheduler
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["python", "main.py", "run-scheduler"]
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    networks:
      - jtech-net

  nginx:
    image: nginx:1.25-alpine
    container_name: jtech-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - jtech-net

networks:
  jtech-net:
    driver: bridge
